name: Live evaluation contract

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'

permissions:
  contents: read

concurrency:
  group: live-evaluation-contract
  cancel-in-progress: false

jobs:
  live-contract:
    name: Authorized paid contract smoke
    runs-on: ubuntu-latest
    environment: live-evaluation
    env:
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      AI_GATEWAY_LIVE_COST_ACK: I_ACCEPT_LIVE_EVALUATION_COSTS
      GOTOOLCHAIN: local
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pinned primary Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          check-latest: false
          cache: false

      - name: Require exactly one authorized credential
        shell: bash
        run: |
          if [[ -z "${AI_GATEWAY_API_KEY:-}" ]]; then
            echo 'AI_GATEWAY_API_KEY is not configured in the protected live-evaluation environment.' >&2
            exit 1
          fi
          if [[ -n "${VERCEL_OIDC_TOKEN:-}" ]]; then
            echo 'VERCEL_OIDC_TOKEN must not be supplied when AI_GATEWAY_API_KEY is selected.' >&2
            exit 1
          fi

      - name: Run paid live evaluation contract
        run: env -u VERCEL_OIDC_TOKEN go test -tags=livecontract ./internal/livecontract -run '^TestGatewayEvaluationContract$' -count=1
